openapi: 3.0.3
info:
  title: Whats Awesome Backend API
  version: 0.2.0
  description: |
    Whats Awesome 后端标准接口文档。

    当前实现为 Node Express 本地骨架，接口契约对齐后续华为云 APIG + FunctionGraph + GaussDB。
    REST 接口分为 Portal 人类用户 API、Admin 人类管理 API、Admin-Agent 管理侧 Agent API。
    用户面开发者 Agent 不调用 REST 点亮接口，后续走 Portal MCP 服务；MCP 契约见 `for-agent-dev/07-portal-mcp-contract.md`。
servers:
  - url: http://localhost:8000
    description: Local backend
tags:
  - name: Health
  - name: Meta
  - name: Skill
  - name: Case
  - name: Player
  - name: Quest
  - name: Admin
  - name: AdminAgent
paths:
  /api/health:
    get:
      tags: [Health]
      summary: 健康检查
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/portal/meta/stages:
    get:
      tags: [Meta]
      summary: 获取 Boss Lv 八境映射
      responses:
        '200':
          description: 境界列表
          content:
            application/json:
              schema:
                type: object
                required: [stages]
                properties:
                  stages:
                    type: array
                    items:
                      $ref: '#/components/schemas/DifficultyStage'

  /api/portal/meta/labels:
    get:
      tags: [Meta]
      summary: 获取标签字典
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: object
                required: [labels]
                properties:
                  labels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Label'

  /api/portal/skills:
    get:
      tags: [Skill]
      summary: 获取已发布技能列表
      parameters:
        - name: tag
          in: query
          schema: { type: string }
          description: 标签 key
        - name: min_lv
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: max_lv
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: q
          in: query
          schema: { type: string }
          description: 搜索技能名、厂商或简介
      responses:
        '200':
          description: 技能卡片列表
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillCard'

  /api/portal/skills/{slug}:
    get:
      tags: [Skill]
      summary: 获取技能详情
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: 技能详情，包含完整 Doc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/portal/cases:
    get:
      tags: [Case]
      summary: 获取已发布案例列表
      parameters:
        - name: tag
          in: query
          schema: { type: string }
          description: 标签 key
        - name: q
          in: query
          schema: { type: string }
          description: 搜索案例名或场景说明
      responses:
        '200':
          description: 案例卡片列表
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaseCard'

  /api/portal/cases/{slug}:
    get:
      tags: [Case]
      summary: 获取案例详情
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: 案例详情，包含组合技能卡片
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/portal/news:
    get:
      tags: [Skill]
      summary: 获取已发布资讯列表
      responses:
        '200':
          description: 资讯列表
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/News'

  /api/portal/players:
    post:
      tags: [Player]
      summary: 创建或更新玩家档案
      description: |
        迭代二本地实现直接接收 GitCode 用户资料。
        正式云上版本由 GitCode OAuth callback 换取用户信息后调用同一领域逻辑。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerRequest'
      responses:
        '201':
          description: 新玩家已创建
          content:
            application/json:
              schema:
                type: object
                required: [player]
                properties:
                  player:
                    $ref: '#/components/schemas/Player'
        '200':
          description: 已存在玩家被更新
          content:
            application/json:
              schema:
                type: object
                required: [player]
                properties:
                  player:
                    $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/portal/players/{id}/profile:
    get:
      tags: [Player]
      summary: 获取玩家个人主页聚合数据
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 玩家主页数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/portal/quests:
    get:
      tags: [Quest]
      summary: 查询闯关/点亮申请流水
      parameters:
        - name: player_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JudgeStatus'
      responses:
        '200':
          description: 闯关申请列表
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Quest'

  /api/portal/quests/manual:
    post:
      tags: [Quest]
      summary: 提交手工点亮申请
      description: |
        玩家提交截图、日志或作品链接等证据。文件正式版本走 OBS 预签名 URL 上传，
        本接口只保存 evidence 元数据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitManualQuestRequest'
      responses:
        '201':
          description: 申请已进入 pending
          content:
            application/json:
              schema:
                type: object
                required: [quest]
                properties:
                  quest:
                    $ref: '#/components/schemas/Quest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/quests/{id}/review:
    post:
      tags: [Admin]
      summary: 管理员审核点亮申请
      x-implementation-status: implemented
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: x-admin-id
          in: header
          required: true
          schema: { type: string }
          description: |
            迭代二本地白名单: admin-founder / admin-secretary。
            正式版本由 GitCode OAuth + RBAC 注入管理员身份。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewQuestRequest'
      responses:
        '200':
          description: 审核完成。通过时可能返回新发放勋章。
          content:
            application/json:
              schema:
                type: object
                required: [quest, granted_badges]
                properties:
                  quest:
                    $ref: '#/components/schemas/Quest'
                  granted_badges:
                    type: array
                    items:
                      $ref: '#/components/schemas/Badge'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 申请已经审核过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/me:
    get:
      tags: [Admin]
      summary: 获取当前管理员身份
      description: 正式版本由 GitCode OAuth + 服务端 RBAC 判断是否为管理员。
      x-implementation-status: planned
      security:
        - AdminSession: []
      responses:
        '200':
          description: 当前管理员身份和权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/skill-candidates:
    get:
      tags: [Admin]
      summary: 查询技能候选
      description: 管理端读取技能 Agent 通过 /api/admin-agent/skill-candidates 提交的候选。
      x-implementation-status: implemented
      security:
        - AdminSession: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CandidateStatus'
      responses:
        '200':
          description: 技能候选列表
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillCandidate'

  /api/admin/skill-candidates/{id}/approve:
    post:
      tags: [Admin]
      summary: 审核通过技能候选
      x-implementation-status: implemented
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateReviewRequest'
      responses:
        '200':
          description: 候选已发布或合并到技能库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateReviewResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/skill-candidates/{id}/reject:
    post:
      tags: [Admin]
      summary: 驳回技能候选
      x-implementation-status: implemented
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateReviewRequest'
      responses:
        '200':
          description: 候选已驳回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateReviewResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/news-candidates:
    get:
      tags: [Admin]
      summary: 查询资讯候选
      description: 管理端读取技能 Agent 通过 /api/admin-agent/news-candidates 提交的资讯候选。
      x-implementation-status: implemented
      security:
        - AdminSession: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CandidateStatus'
      responses:
        '200':
          description: 资讯候选列表
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NewsCandidate'

  /api/admin/news-candidates/{id}/publish:
    post:
      tags: [Admin]
      summary: 发布资讯候选
      x-implementation-status: implemented
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateReviewRequest'
      responses:
        '200':
          description: 资讯已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateReviewResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/news-candidates/{id}/reject:
    post:
      tags: [Admin]
      summary: 驳回资讯候选
      x-implementation-status: implemented
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateReviewRequest'
      responses:
        '200':
          description: 资讯候选已驳回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateReviewResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin-agent/crawl-runs:
    post:
      tags: [AdminAgent]
      summary: 创建 AI 抓取批次
      description: FunctionGraph 定时任务启动时创建批次，用于后续候选内容追踪。
      x-implementation-status: planned
      security:
        - AdminAgentId: []
          AdminAgentSignature: []
          AdminAgentTimestamp: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCrawlRunRequest'
      responses:
        '201':
          description: 抓取批次已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlRun'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin-agent/skill-candidates:
    post:
      tags: [AdminAgent]
      summary: 技能 Agent 提交技能候选
      description: 只写入 pending_review，不直接发布到用户面。
      x-implementation-status: implemented
      security:
        - AdminAgentId: []
          AdminAgentSignature: []
          AdminAgentTimestamp: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCandidateSubmission'
      responses:
        '201':
          description: 技能候选已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCandidate'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin-agent/news-candidates:
    post:
      tags: [AdminAgent]
      summary: 技能 Agent 提交资讯候选
      description: 只写入 pending_review，管理端审核发布后用户面可见。
      x-implementation-status: implemented
      security:
        - AdminAgentId: []
          AdminAgentSignature: []
          AdminAgentTimestamp: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsCandidateSubmission'
      responses:
        '201':
          description: 资讯候选已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsCandidate'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin-agent/case-candidates:
    post:
      tags: [AdminAgent]
      summary: 技能 Agent 提交案例候选
      description: 只写入 pending_review，管理端审核发布后用户面可见。
      x-implementation-status: planned
      security:
        - AdminAgentId: []
          AdminAgentSignature: []
          AdminAgentTimestamp: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCandidateSubmission'
      responses:
        '201':
          description: 案例候选已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCandidate'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    UserSession:
      type: apiKey
      in: cookie
      name: wa_session
      description: GitCode OAuth 登录后的用户会话。
    AdminSession:
      type: apiKey
      in: cookie
      name: wa_admin_session
      description: GitCode OAuth + RBAC 后的管理员会话；本地临时用 x-admin-id 模拟。
    AdminAgentId:
      type: apiKey
      in: header
      name: x-admin-agent-id
      description: 管理侧内部 Agent 客户端 ID。
    AdminAgentSignature:
      type: apiKey
      in: header
      name: x-admin-agent-signature
      description: 管理侧 Agent 请求签名，密钥存 DEW/CSMS，不写入仓库。
    AdminAgentTimestamp:
      type: apiKey
      in: header
      name: x-admin-agent-timestamp
      description: 签名时间戳，用于防重放。

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: x-idempotency-key
      in: header
      required: true
      schema: { type: string }
      description: 写接口幂等键，避免定时任务重试造成重复候选。

  responses:
    ValidationError:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 没有权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [ok, service]
      properties:
        ok: { type: boolean }
        service: { type: string }

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

    AdminMeResponse:
      type: object
      required: [admin_id, roles, permissions]
      properties:
        admin_id: { type: string }
        gitcode_username: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }

    CandidateStatus:
      type: string
      enum: [pending_review, approved, rejected, merged]

    ModelMeta:
      type: object
      required: [provider, model, prompt_version, generated_at]
      properties:
        provider: { type: string, example: Huawei Cloud Pangu }
        model: { type: string }
        prompt_version: { type: string }
        generated_at: { type: string, format: date-time }

    CandidateProvenance:
      type: object
      required: [source_url, source_vendor, crawl_run_id]
      properties:
        source_url: { type: string }
        source_vendor: { type: string }
        crawl_run_id: { type: string }
        raw_snapshot_url: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        model_meta:
          $ref: '#/components/schemas/ModelMeta'

    CreateCrawlRunRequest:
      type: object
      required: [source_type, started_at]
      properties:
        source_type: { type: string, enum: [skill, news, case, mixed] }
        started_at: { type: string, format: date-time }
        source_count: { type: integer }

    CrawlRun:
      type: object
      required: [id, source_type, status, started_at]
      properties:
        id: { type: string }
        source_type: { type: string }
        status: { type: string, enum: [running, succeeded, failed, partial] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        stats:
          type: object
          additionalProperties: true

    SkillCandidateSubmission:
      type: object
      required: [name, slug, vendor_name, category_tags, difficulty_lv, importance, doc, provenance]
      properties:
        name: { type: string }
        slug: { type: string }
        vendor_name: { type: string }
        vendor_type: { type: string }
        logo_url: { type: string }
        category_tags:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        difficulty_lv: { type: integer, minimum: 1, maximum: 100 }
        importance:
          $ref: '#/components/schemas/Importance'
        doc:
          $ref: '#/components/schemas/SkillDoc'
        related_news:
          type: array
          items:
            type: object
            additionalProperties: true
        provenance:
          $ref: '#/components/schemas/CandidateProvenance'

    SkillCandidate:
      allOf:
        - $ref: '#/components/schemas/SkillCandidateSubmission'
        - type: object
          required: [id, status, created_at]
          properties:
            id: { type: string }
            status:
              $ref: '#/components/schemas/CandidateStatus'
            review_note: { type: string }
            created_at: { type: string, format: date-time }

    NewsCandidateSubmission:
      type: object
      required: [title, summary, source_url, provenance]
      properties:
        title: { type: string }
        summary: { type: string }
        source_url: { type: string }
        published_at: { type: string, format: date-time }
        related_skill_slug: { type: string }
        provenance:
          $ref: '#/components/schemas/CandidateProvenance'

    News:
      type: object
      required: [id, title, summary, source_url, status]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        source_url: { type: string }
        published_at: { type: string, format: date-time }
        related_skill_slug: { type: string }
        status: { type: string, enum: [draft, published, archived] }

    NewsCandidate:
      allOf:
        - $ref: '#/components/schemas/NewsCandidateSubmission'
        - type: object
          required: [id, status, created_at]
          properties:
            id: { type: string }
            status:
              $ref: '#/components/schemas/CandidateStatus'
            review_note: { type: string }
            created_at: { type: string, format: date-time }

    CaseCandidateSubmission:
      type: object
      required: [name, slug, scenario_desc, skill_slugs, category_tags, difficulty_lv, importance, provenance]
      properties:
        name: { type: string }
        slug: { type: string }
        scenario_desc: { type: string }
        skill_slugs:
          type: array
          items: { type: string }
        category_tags:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        difficulty_lv: { type: integer, minimum: 1, maximum: 100 }
        importance:
          $ref: '#/components/schemas/Importance'
        provenance:
          $ref: '#/components/schemas/CandidateProvenance'

    CaseCandidate:
      allOf:
        - $ref: '#/components/schemas/CaseCandidateSubmission'
        - type: object
          required: [id, status, created_at]
          properties:
            id: { type: string }
            status:
              $ref: '#/components/schemas/CandidateStatus'
            review_note: { type: string }
            created_at: { type: string, format: date-time }

    CandidateReviewRequest:
      type: object
      properties:
        review_note: { type: string }
        publish_slug: { type: string }

    CandidateReviewResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status:
          $ref: '#/components/schemas/CandidateStatus'
        published_slug: { type: string }
        review_note: { type: string }

    Label:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
        category: { type: string }
        type: { type: string, enum: [domain, vendor] }

    DifficultyStage:
      type: object
      required: [stage, min_lv, max_lv]
      properties:
        stage: { type: string }
        name: { type: string }
        min_lv: { type: integer }
        max_lv: { type: integer }
        icon: { type: string }
        color: { type: string }
        desc: { type: string }

    StageView:
      type: object
      nullable: true
      properties:
        name: { type: string }
        icon: { type: string }
        color: { type: string }
        desc: { type: string }

    Importance:
      type: object
      required: [score, basis]
      properties:
        score: { type: number, minimum: 0, maximum: 10 }
        basis: { type: string }
        evaluated_at: { type: string }

    SkillCard:
      type: object
      required:
        - slug
        - name
        - vendor_name
        - category_tags
        - difficulty_lv
        - importance
        - summary
        - status
      properties:
        slug: { type: string }
        name: { type: string }
        vendor_name: { type: string }
        vendor_type: { type: string }
        logo_url: { type: string }
        category_tags:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        difficulty_lv: { type: integer, minimum: 1, maximum: 100 }
        stage:
          $ref: '#/components/schemas/StageView'
        importance:
          $ref: '#/components/schemas/Importance'
        summary: { type: string }
        status: { type: string, enum: [draft, published, archived] }

    SkillDoc:
      type: object
      required: [summary, official_url, repo_url, ecosystem, hello_world, learning_prompt]
      properties:
        summary: { type: string }
        official_url: { type: string }
        repo_url: { type: string }
        ecosystem: { type: string }
        hello_world: { type: string }
        learning_prompt: { type: string }

    SkillDetail:
      allOf:
        - $ref: '#/components/schemas/SkillCard'
        - type: object
          required: [doc]
          properties:
            doc:
              $ref: '#/components/schemas/SkillDoc'
            related_news:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  url: { type: string }
                  date: { type: string }

    CaseCard:
      type: object
      required: [slug, name, scenario_desc, source, skill_slugs, difficulty_lv, importance, status]
      properties:
        slug: { type: string }
        name: { type: string }
        scenario_desc: { type: string }
        source: { type: string, enum: [ai_generated, manual] }
        skill_slugs:
          type: array
          items: { type: string }
        category_tags:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        difficulty_lv: { type: integer, minimum: 1, maximum: 100 }
        stage:
          $ref: '#/components/schemas/StageView'
        importance:
          $ref: '#/components/schemas/Importance'
        status: { type: string, enum: [draft, published, archived] }

    CaseDetail:
      allOf:
        - $ref: '#/components/schemas/CaseCard'
        - type: object
          properties:
            skills:
              type: array
              items:
                $ref: '#/components/schemas/SkillCard'

    CreatePlayerRequest:
      type: object
      required: [gitcode_id, gitcode_username]
      properties:
        gitcode_id: { type: string }
        gitcode_username: { type: string }
        avatar_url: { type: string }

    Player:
      type: object
      required: [id, gitcode_id, gitcode_username, role, badges, growth]
      properties:
        id: { type: string }
        gitcode_id: { type: string }
        gitcode_username: { type: string }
        avatar_url: { type: string }
        role: { type: string, enum: [player, admin] }
        badges:
          type: array
          items:
            $ref: '#/components/schemas/Badge'
        growth:
          $ref: '#/components/schemas/Growth'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Growth:
      type: object
      required: [realm, exp, total_lit, lit_skill_slugs, lit_case_slugs]
      properties:
        realm: { type: string }
        exp: { type: integer }
        total_lit: { type: integer }
        lit_skill_slugs:
          type: array
          items: { type: string }
        lit_case_slugs:
          type: array
          items: { type: string }

    Badge:
      type: object
      required: [key, name, title, icon, description, granted_at]
      properties:
        key: { type: string }
        name: { type: string }
        title: { type: string }
        icon: { type: string }
        description: { type: string }
        granted_at: { type: string, format: date-time }

    Evidence:
      type: object
      required: [description]
      properties:
        description: { type: string }
        file_url: { type: string, description: OBS object URL or signed object reference }
        artifact_url: { type: string }
        repository_url: { type: string }
        extra:
          type: object
          additionalProperties: true

    TargetType:
      type: string
      enum: [skill, case]

    JudgeStatus:
      type: string
      enum: [pending, approved, rejected]

    Quest:
      type: object
      required: [id, player_id, target_type, target_slug, method, evidence, judge_status]
      properties:
        id: { type: string }
        player_id: { type: string }
        target_type:
          $ref: '#/components/schemas/TargetType'
        target_slug: { type: string }
        method:
          type: string
          enum: [manual_upload, mcp_auto, admin_grant]
        evidence:
          $ref: '#/components/schemas/Evidence'
        judge_status:
          $ref: '#/components/schemas/JudgeStatus'
        judged_by: { type: string }
        judge_note: { type: string }
        lit_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SubmitManualQuestRequest:
      type: object
      required: [player_id, target_type, target_slug, evidence]
      properties:
        player_id: { type: string }
        target_type:
          $ref: '#/components/schemas/TargetType'
        target_slug: { type: string }
        evidence:
          $ref: '#/components/schemas/Evidence'

    ReviewQuestRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        judge_note: { type: string }

    PlayerProfile:
      type: object
      required: [player, growth, badges, lit_skills, lit_cases, recent_quests]
      properties:
        player:
          $ref: '#/components/schemas/Player'
        growth:
          $ref: '#/components/schemas/Growth'
        badges:
          type: array
          items:
            $ref: '#/components/schemas/Badge'
        lit_skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillCard'
        lit_cases:
          type: array
          items:
            $ref: '#/components/schemas/CaseCard'
        recent_quests:
          type: array
          items:
            $ref: '#/components/schemas/Quest'
